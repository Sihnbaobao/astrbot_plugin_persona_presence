<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Persona Presence · 控制台</title>
  <link rel="stylesheet" href="./style.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">璃</span>
        <span class="brand-copy">
          <strong>Persona Presence</strong>
          <em class="brand-ver" id="ver">…</em>
        </span>
      </div>

      <nav class="sidebar-nav" id="nav">
        <p class="nav-label">运行</p>
        <button class="nav-item is-active" data-view="overview">
          <span class="nav-icon">◍</span><span>概览</span>
        </button>
        <button class="nav-item" data-view="config">
          <span class="nav-icon">⚙</span><span>配置</span>
        </button>

        <p class="nav-label">能力</p>
        <button class="nav-item" data-view="dlc">
          <span class="nav-icon">❖</span><span>资料片</span>
        </button>
        <button class="nav-item" data-view="network">
          <span class="nav-icon">◎</span><span>记忆网络</span>
        </button>
        <button class="nav-item" data-view="prompt">
          <span class="nav-icon">✎</span><span>提示词</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-row">
          <span class="dot" id="dotMain"></span>
          <span id="mainSwitch">加载中…</span>
        </div>
        <div class="foot-note" id="tendencyPill">倾向：…</div>
        <div class="foot-note" id="smartPill">并发：…</div>
      </div>
    </aside>

    <div class="main-stage">
      <header class="topbar">
        <div class="crumb">
          <span>Persona Presence</span><i>/</i><strong id="crumb">概览</strong>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" title="刷新数据">⟳</button>
          <button class="icon-btn" id="themeBtn" title="切换深浅色">◐</button>
        </div>
      </header>

      <main class="content">
        <section class="view is-active" id="view-overview">
          <div class="view-head">
            <h1>概览</h1>
            <p>它现在以什么状态存在，哪些能力已经装上。</p>
          </div>
          <div class="stat-grid" id="overviewCards"></div>
        </section>

        <section class="view" id="view-dlc">
          <div class="view-head">
            <h1>资料片</h1>
            <p>每一套是独立能力。关掉之后，本体的私聊群聊回复照常运行。</p>
          </div>
          <div class="dlc-grid" id="dlcGrid"></div>
        </section>

        <section class="view" id="view-config">
          <div class="view-head">
            <h1>配置</h1>
            <p>一次只改一组，改完点保存。</p>
          </div>
          <div class="settings">
            <aside class="settings-rail" id="tabs"></aside>
            <div class="panel" id="configPanel"></div>
          </div>
        </section>

        <section class="view" id="view-network">
          <div class="view-head">
            <h1>记忆网络</h1>
            <p>每个点是一条它记着的事。点开可以看到它会以什么形式进入上下文。</p>
          </div>
          <div class="net-layout">
            <div class="net-canvas">
              <svg id="netSvg" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet"></svg>
              <div class="net-legend" id="netLegend"></div>
            </div>
            <aside class="net-panel" id="netSide">
              <div class="net-empty">选择左侧任意一个节点</div>
            </aside>
          </div>
        </section>

        <section class="view" id="view-prompt">
          <div class="view-head">
            <h1>提示词</h1>
            <p>参与判断与回复生成时，实际拼接进模型的内容。</p>
          </div>
          <div class="prompt-grid" id="promptGrid"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="tipBox"></div>
  <div id="toast"></div>
  <script src="./app.js?v=3"></script>
</body>
</html>
